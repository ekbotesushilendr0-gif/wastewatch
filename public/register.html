<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — WasteWatch</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-icon">♻️</div>
    WasteWatch
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="report.html">Report Waste</a></li>
    <li><a href="complaints.html">My Complaints</a></li>
    <li><a href="city-status.html">City Status</a></li>
    <li><a href="admin.html">Admin</a></li>
    <li><a href="login.html" class="btn-nav nav-login-link">Login</a></li>
  </ul>
</nav>

<div class="auth-wrap">
  <div class="auth-card">

    <!-- STEP 1: Register form -->
    <div id="step-register" class="otp-step active">
      <div class="auth-logo">
        <div class="logo-icon">♻️</div>
        <h2>Create Account</h2>
        <p>Join WasteWatch and start reporting waste issues</p>
      </div>

      <form id="registerForm">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" id="regEmail" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="regPassword" class="form-control" placeholder="Create password (min 6 chars)" required>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" id="regConfirmPassword" class="form-control" placeholder="Confirm password" required>
        </div>

        <div id="formError" style="display:none;color:var(--danger);font-size:0.85rem;background:rgba(224,82,82,0.08);border:1px solid rgba(224,82,82,0.2);border-radius:8px;padding:10px 14px;margin-bottom:0.5rem;"></div>

        <button type="submit" class="btn btn-primary btn-block">
          Create Account →
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Login</a>
      </div>
    </div>

    <!-- STEP 2: OTP verification -->
    <div id="step-otp" class="otp-step">
      <div class="auth-logo">
        <div class="logo-icon">📧</div>
        <h2>Verify Your Email</h2>
        <p>We sent a 6-digit code to<br><strong id="otpEmailDisplay" style="color:var(--green-dark)"></strong></p>
      </div>

      <form id="otpForm">
        <div class="form-group">
          <label>Verification Code</label>
          <input type="text" id="otpInput" class="form-control" placeholder="Enter 6-digit OTP"
            maxlength="6" inputmode="numeric" autocomplete="one-time-code"
            style="font-size:1.4rem;letter-spacing:8px;text-align:center;font-weight:700;" required>
        </div>

        <div id="otpError" style="display:none;color:var(--danger);font-size:0.85rem;background:rgba(224,82,82,0.08);border:1px solid rgba(224,82,82,0.2);border-radius:8px;padding:10px 14px;margin-bottom:0.5rem;"></div>

        <button type="submit" class="btn btn-primary btn-block">
          Verify & Continue →
        </button>
      </form>

      <div class="auth-footer" style="margin-top:1rem;">
        Didn't receive it? 
        <button id="resendOtpBtn" style="background:none;border:none;color:var(--green);font-weight:600;cursor:pointer;font-size:inherit;padding:0;text-decoration:underline;">
          Resend OTP
        </button>
        &nbsp;·&nbsp;
        <a href="#" onclick="document.getElementById('step-otp').classList.remove('active');document.getElementById('step-register').classList.add('active');return false;">
          Back
        </a>
      </div>
    </div>

  </div>
</div>

<script src="script.js"></script>
</body>
</html>
