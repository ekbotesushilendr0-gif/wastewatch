<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — WasteWatch</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/mobile.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script defer src="js/common.js"></script>
  <script defer src="js/auth.js"></script>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">
    <div class="logo-icon"><i data-lucide="recycle"></i></div>
    WasteWatch
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="report.html">Report Waste</a></li>
    <li><a href="profile.html">Profile</a></li>
    <li><a href="city-status.html">City Status</a></li>
    <li><a href="admin.html">Admin</a></li>
    <li><a href="worker.html">Worker</a></li>
    <li><a href="login.html" class="btn-nav active nav-login-link">Login</a></li>
  </ul>
</nav>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon"><i data-lucide="recycle"></i></div>
      <h2>Welcome Back</h2>
      <p>Sign in to track and manage your complaints</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-icon-wrap">
          <span class="input-icon"><i data-lucide="mail" style="width:18px;height:18px;color:var(--text-muted);"></i></span>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-icon-wrap">
          <span class="input-icon"><i data-lucide="lock" style="width:18px;height:18px;color:var(--text-muted);"></i></span>
          <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
        </div>
      </div>

      <div id="formError" style="display:none;color:var(--danger);font-size:0.88rem;background:rgba(224,82,82,0.08);border:1px solid rgba(224,82,82,0.2);border-radius:8px;padding:10px 14px;margin-bottom:0.5rem;"></div>
      <button type="submit" class="btn btn-primary btn-block">Sign In →</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="register.html">Create one</a>
    </div>
  </div>
</div>

</body>
</html>
